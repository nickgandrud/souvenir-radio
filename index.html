<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="/Souviner2.png">
  <title>Souvenir Radio</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-- text-dark">

  <header class="site-header">
    <div class="container-fluid site-header-inner">
      <a href="#listen" class="site-brand">
        <span>souvenir radio</span>
        <img src="/Souviner2.png" alt="" class="site-brand-icon">
        </a>
      

      <nav class="site-nav" aria-label="Main navigation">
        <a href="#listen">Now Playing</a>
        <a href="#upcoming-broadcasts">Upcoming Broadcasts</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="site-header-spacer" aria-hidden="true"></div>
    </div>
  </header>

  <main>
    <section id="listen" class="listen-shell">
      <div class="container">
        <section class="card border bg-card mx-auto listen-card">
          <div class="card-body">
            <div class="listen-row">
              <button
                id="artWrap"
                class="art-wrap art-trigger position-relative"
                type="button"
                aria-label="Play or pause stream"
              >
                <span id="live" class="live-badge" hidden>
                  LIVE <span class="live-dot" aria-hidden="true"></span>
                </span>

                <img id="art" class="art" alt="" />

                <div class="art-overlay" id="artOverlay" aria-hidden="true">
                  <div class="art-overlay-button">
                    <i id="artOverlayIcon" class="bi bi-play-fill"></i>
                  </div>
                </div>
              </button>

              <div class="listen-meta">
                <button
                  id="mix-toggle"
                  class="mix-toggle mt-2"
                  type="button"
                  aria-expanded="true"
                  aria-controls="mix-description"
                >
                  <span id="mix" class="mix">Loading…</span>
                </button>

                <div id="mix-description" class="mix-description mt-2"></div>
                <div id="listeners" class="text-muted small mt-2 text-center"></div>
                <audio id="audio" preload="none" crossorigin="anonymous"></audio>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>

    <section id="upcoming-broadcasts" class="container mt-5">
  <div class="text-center upcoming-broadcasts-title">
    Upcoming Broadcasts
  </div>

  <div id="upcoming-broadcasts-list" class="row g-3 mt-1"></div>
</section>

<section id="about" class="container mt-5">
  <div class="text-center upcoming-broadcasts-title">
    ABOUT
  </div>

  <div class="row g-3 mt-1">
    <div class="col-12">
      <div class="card bg-card border shadow-sm h-100">
        <div class="card-body">
          <p class="mb-0 about-contact-text">
            Souvenir Radio is a Twin Cities based internet radio station. Featuring music and other things.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="contact" class="container mt-5 mb-5">
  <div class="text-center upcoming-broadcasts-title">
    CONTACT
  </div>

  <div class="row g-3 mt-1">
    <div class="col-12">
      <div class="card bg-card border shadow-sm h-100">
        <div class="card-body">
          <p class="mb-0 about-contact-text">
            Add email here. 
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
  </main>

  <div class="volume-fab" id="volumeFab" aria-label="Volume control">
    <button class="btn btn-light" id="muteBtn" type="button" aria-label="Volume / Mute">
      <i class="bi bi-volume-up-fill"></i>
    </button>

    <div class="volume-panel" id="volumePanel" aria-hidden="true">
      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1"
        aria-label="Volume"
      />
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
