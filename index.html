<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Radio Station</title>

  <!-- ✅ Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Your minimal overrides -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="text-light">

  <main class="container py-4">
    <section id="listen" class="card border-0 shadow-sm bg-card">
      <div class="card-body">

        <!-- Header row -->
        <div class="d-flex align-items-center justify-content-between gap-2">
          <h1 class="h4 mb-0">Listen Live</h1>
          <!-- keep your existing hidden toggle -->
          <span id="live" class="pill" hidden>LIVE</span>
        </div>

        <!-- Now playing row -->
        <div class="d-flex align-items-start gap-3 mt-3">
          <img id="art" class="art rounded" alt="" />

          <div class="flex-grow-1">
            <div class="text-muted small">Now Playing</div>
            <div id="mix" class="mix mt-1">Loading…</div>
            <div id="mix-description" class="mix-description mt-2"></div>
            <div id="listeners" class="text-muted small mt-2"></div>

            <div class="d-flex align-items-center gap-2 mt-3 flex-wrap">
              <button id="play" class="btn btn-primary fw-bold px-4">Play</button>
              <audio id="audio" preload="none" crossorigin="anonymous"></audio>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
