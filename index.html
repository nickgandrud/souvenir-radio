<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Radio Station</title>

  <!-- ✅ Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Your minimal overrides -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-white text-dark">
<header class="py-4 text-center">
  <img src="/Souviner.png" alt="Souvenir Radio" class="site-logo img-fluid">
</header>

                <!-- Scrolling Ticker -->
        <div class="container">
          <div class="ticker-wrap my-3">
            <div class="ticker" id="ticker">
              <span class="ticker-item">
                Welcome to Souvenir Radio • Twin Cities DJs • Live sets + recorded mixes • More features coming soon
              </span>
            </div>
          </div>
        </div>

  <main class="container py-4">
    <section id="listen" class="card border-0 shadow-sm bg-card mx-auto w-75">
      <div class="card-body">
        <!-- Header row -->
        <div class="d-flex align-items-center justify-content-between gap-2">
        </div>

        <!-- Now playing row -->
         <div class="d-flex align-items-start gap-3 mt-3 flex-column flex-md-row">
          <!-- Art + overlay button -->
          <div class="art-wrap position-relative">
            <span id="live" class="live-badge" hidden>LIVE <span class="live-dot" aria-hidden="true"></span>
            </span>
            <img id="art" class="art rounded" alt="" />

            <button id="play" class="btn btn-primary art-control" type="button" aria-label="Play/Pause">
              <i class="bi bi-play-fill fs-4"></i>
            </button>
          </div>

          <div class="flex-grow-1">
           
            <div id="mix" class="mix mt-1 text-center">Loading…</div>
            <div id="mix-description" class="mix-description mt-2 text-center"></div>
            <div id="listeners" class="text-muted small mt-2"></div>

            <!-- audio stays here (button moved onto art) -->
            <audio id="audio" preload="none" crossorigin="anonymous"></audio>
          </div>
        </div>
       

      </div>
    </section>
  </main>

<!-- Floating Volume Control (collapsible) -->
<div class="volume-fab" id="volumeFab" aria-label="Volume control">
  <button class="btn btn-light border" id="muteBtn" type="button" aria-label="Volume / Mute">
    <i class="bi bi-volume-up-fill"></i>
  </button>

  <div class="volume-panel" id="volumePanel" aria-hidden="true">
    <input
      id="volumeSlider"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="1"
      aria-label="Volume"
    />
  </div>
</div>

  <script type="module" src="app.js"></script>
</body>
</html>
